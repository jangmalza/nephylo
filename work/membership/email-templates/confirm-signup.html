<!doctype html>
<html lang="ko">
<body style="margin:0;background:#f4f4f4;color:#111;font-family:Arial,'Malgun Gothic',sans-serif">
  <main style="max-width:480px;margin:32px auto;padding:32px;background:#fff;border:1px solid #ddd">
    <p style="margin:0 0 24px;font-size:13px;letter-spacing:1px">Nephylo</p>
    <h1 style="margin:0 0 16px;font-size:24px">이메일 주소를 확인해 주세요</h1>
    <p style="font-size:15px;line-height:1.7">위젯이나 회원 페이지에 아래 인증번호를 입력하면 이메일 인증과 로그인이 완료됩니다.</p>
    <p style="margin:28px 0;padding:20px;background:#f4f4f4;font-size:32px;font-weight:700;letter-spacing:8px;text-align:center">{{ .Token }}</p>
    <p style="font-size:14px;line-height:1.7">회원가입만으로 Pro가 활성화되지는 않습니다. 무료 버전은 로그인 없이 계속 사용할 수 있습니다.</p>
    <p style="margin-top:28px;font-size:12px;line-height:1.7;color:#666">인증을 요청하지 않으셨다면 이 메일을 무시해 주세요. 인증번호를 다른 사람에게 알려주지 마세요.</p>
  </main>
</body>
</html>
