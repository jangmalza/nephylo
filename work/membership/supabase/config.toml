project_id = "usage-widget-membership"

# Each handler performs its own authorization. The webhook re-reads known orders
# from Toss; the renewal worker requires a separate scheduler secret.
[functions.billing-api]
verify_jwt = false

[functions.billing-webhook]
verify_jwt = false

[functions.billing-renew]
verify_jwt = false

# International API verifies Auth itself; webhook checks raw-body HMAC; the
# reconciliation worker requires its own server-only scheduler secret.
[functions.international-billing-api]
verify_jwt = false
[functions.international-billing-webhook]
verify_jwt = false
[functions.international-billing-reconcile]
verify_jwt = false
